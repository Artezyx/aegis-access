name: Verificar Aegis Access
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Generar cliente Prisma
        run: npx prisma generate
      - name: Comprobaciones offline
        run: npm run test:offline
      - name: Pruebas de servicios
        run: npm test
      - name: Pruebas HTTP sobre base de datos simulada
        run: npm run test:e2e
      - name: Compilar NestJS
        run: npm run build
